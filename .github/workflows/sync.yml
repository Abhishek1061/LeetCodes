name: Sync LeetCode Submissions

on:
  workflow_dispatch: # Allows you to run it manually
  schedule:
    - cron: '0 8 * * *' # Runs automatically every day at 8 AM UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Submissions
        uses: joshcai/leetcode-sync@v1.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ 'IaY372EiPkhcXI03NCoxrndqYf4pkjVt' }}
          leetcode-session: ${{ 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..79lD4Lko_BC-MkPzWh4gXgXWTo5u7_p0nFt3xH8oO1k' }}
          destination-folder: 'solutions'
